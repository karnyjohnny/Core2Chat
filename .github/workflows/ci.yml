# Core2Chat CI: testy -> build (Windows: onedir + onefile) -> draft release
#
# Założenia (task §18):
#   * runner Windows NIE jest równoznaczny z runtime Windows 7. Obrazy
#     GitHuba to Windows Server 2022/2025 (`windows-2019` wycofany
#     2025-06-30), więc build odbywa się na `windows-2022`.
#   * kompatybilność z Windows 7 SP1 zapewniają piny: Python 3.8 (ostatnia
#     linia wspierająca Win7), PyQt5 5.15.11, PyInstaller 5.13.2. Bootloader
#     PyInstallera 5.13.2 jest kompilowany z NTDDI_VERSION=0x06010000
#     (_WIN32_WINNT=0x0601 = Windows 7).
#   * CI instaluje Python 3.8.10, bo to OSTATNIA wersja 3.8, dla której
#     python.org publikuje oficjalne binaria; 3.8.11+ istnieją wyłącznie jako
#     kod źródłowy i actions/setup-python nie może ich pobrać.
#   * Linux w macierzy testów jedzie TYLKO na 3.11: setup-python nie
#     dostarczy 3.8.10 na ubuntu-22.04 (brak buildów w manifeście dla tego
#     obrazu). Rola Linuksa: pilnować, że kod nie używa składni nowszej niż
#     3.8 i że testy przechodzą też na nowszym interpreterze.
#   * Build TYLKO windows-2022 (docelowa platforma): dwa artefakty z JEDNEGO
#     pyinstaller.spec - onedir (zalecany dla Win7) i onefile
#     (CORE2CHAT_ONEFILE=1, przełączany przez `build.py --mode onefile`).
#   * BEZ `cache: pip` w setup-python: na części runnerów kończy się błędem
#     "Could not get cache folder path"; instalacja zależności trwa krócej
#     niż diagnozowanie cache.
#   * artefakt z CI jest "best effort": docelowa weryfikacja musi odbyć się
#     na Windows 7 SP1 (patrz .github/RELEASE.md). CI nie zastępuje tego
#     testu i nie twierdzi, że zastępuje.
#   * sekrety: workflow NIGDY nie używa GEMINI_API_KEY poza opt-in jobem
#     live-api (workflow_dispatch + jawny przełącznik).

name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      run_live_tests:
        description: "Uruchom testy live API (wymaga sekretu GEMINI_API_KEY)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.8.10"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"

jobs:
  # ------------------------------------------------------------------ testy
  tests:
    name: Testy (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Docelowy runtime: Windows + Python 3.8.10 (ostatnia wersja 3.8 z
        # oficjalnymi binariami). Ubuntu tylko 3.11 - patrz nagłówek pliku.
        include:
          - os: windows-2022
            python: "3.8.10"
            qt_platform: "windows"
          - os: ubuntu-22.04
            python: "3.11"
            qt_platform: "offscreen"
    steps:
      - uses: actions/checkout@v4

      - name: Instalacja Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Zależności systemowe (Linux - biblioteki Qt)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0

      - name: Zależności Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Weryfikacja skladni 3.8 i zakazanych zaleznosci
        run: python -m pytest tests/test_py38_compat.py -q

      - name: Testy jednostkowe i integracyjne
        env:
          QT_QPA_PLATFORM: ${{ matrix.qt_platform }}
        run: python -m pytest tests/ -q --tb=short --durations=10

      - name: Start aplikacji (smoke test bez GUI)
        env:
          QT_QPA_PLATFORM: ${{ matrix.qt_platform }}
          CORE2CHAT_DATA_DIR: ${{ runner.temp }}/c2c-data
        run: |
          python main.py --version
          python main.py --diagnostics
          python main.py --smoke-test 2 --no-tray

      - name: Benchmark wydajnosci
        env:
          QT_QPA_PLATFORM: ${{ matrix.qt_platform }}
        run: python tests/perf_benchmark.py --json performance.json

      - name: Artefakt - wyniki pomiarow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ matrix.os }}-py${{ matrix.python }}
          path: performance.json
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------- testy live (opt-in)
  live-api:
    name: Live API smoke test
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_live_tests == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install -r requirements.txt
      - name: Smoke test przeciwko realnemu API
        env:
          CORE2CHAT_LIVE_TEST: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tests/live_gemini_smoke.py
      # Klucz nigdy nie trafia do artefaktu ani do loga: skrypt czyta go
      # wylacznie ze zmiennej srodowiskowej i nie drukuje.

  # -------------------------------------------------------------------- build
  # Tylko Windows: to jest docelowa platforma. Linux build nie powstaje -
  # nie jest wspieranym celem (task §18, decyzja o uproszczeniu CI).
  build:
    name: Build (windows-2022, py3.8.10)
    needs: tests
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Zaleznosci Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Skan sekretow + walidacja spec
        run: python build.py --check

      # ------------------------------------------------------- onedir
      - name: PyInstaller - onedir (windowed)
        run: python build.py --mode release

      - name: Weryfikacja zawartosci onedir
        shell: bash
        run: |
          set -e
          test -f dist/Core2Chat/Core2Chat.exe
          # Zabronione stosy nie moga trafic do paczki (search po calym drzewie).
          forbidden=$(find dist/Core2Chat \( -iname '*webengine*' -o -iname '*webkit*' \
            -o -iname '*qt3d*' -o -iname '*qtquick*' -o -iname '*qtqml*' \
            -o -iname '*pyside*' -o -iname '*pyqt6*' \) -print)
          if [ -n "$forbidden" ]; then
            echo "ZABRONIONY modul Qt w buildzie:"; echo "$forbidden"; exit 1
          fi
          # Zasoby musza byc obecne.
          test -f dist/Core2Chat/assets/style_dark.qss
          test -f dist/Core2Chat/assets/icon.ico
          # Wtyczki platformowe bez ktorych EXE nie wstanie.
          find dist/Core2Chat -iname 'qwindows.dll' | grep -q .

      - name: Smoke test binarium onedir (--diagnostics)
        env:
          QT_QPA_PLATFORM: windows
          CORE2CHAT_DATA_DIR: ${{ runner.temp }}/c2c-exe-onedir
        run: |
          python -c "import subprocess,sys; out=subprocess.run([r'dist/Core2Chat/Core2Chat.exe','--diagnostics'],capture_output=True,text=True,timeout=180); print(out.stdout[-800:]); print(out.stderr[-800:], file=sys.stderr); sys.exit(out.returncode)"

      - name: Rozmiar paczki onedir
        shell: bash
        run: du -sh dist/Core2Chat

      - name: Artefakt - onedir
        uses: actions/upload-artifact@v4
        with:
          name: Core2Chat-windows-x64-onedir
          path: dist/Core2Chat/
          retention-days: 30

      # ------------------------------------------------------- onefile
      # Ten sam pyinstaller.spec; build.py ustawia CORE2CHAT_ONEFILE=1, wiec
      # trimming, zasoby i excludes sa identyczne jak w onedir.
      - name: PyInstaller - onefile
        run: python build.py --mode onefile

      - name: Weryfikacja onefile
        shell: bash
        run: |
          set -e
          test -f dist/Core2Chat.exe
          ls -lh dist/Core2Chat.exe

      - name: Smoke test binarium onefile (--diagnostics, samorozpakowanie)
        env:
          QT_QPA_PLATFORM: windows
          CORE2CHAT_DATA_DIR: ${{ runner.temp }}/c2c-exe-onefile
        run: |
          python -c "import subprocess,sys; out=subprocess.run([r'dist/Core2Chat.exe','--diagnostics'],capture_output=True,text=True,timeout=300); print(out.stdout[-800:]); print(out.stderr[-800:], file=sys.stderr); sys.exit(out.returncode)"

      - name: Artefakt - onefile
        uses: actions/upload-artifact@v4
        with:
          name: Core2Chat-windows-x64-onefile
          path: dist/Core2Chat.exe
          retention-days: 30

  # ------------------------------------------------------------------ release
  release:
    name: Release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pobranie artefaktow
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Core2Chat-windows-x64-*

      - name: Pakowanie archiwow
        run: |
          set -e
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -qr "../$name.zip" .)
          done
          ls -la

      - name: Publikacja release (draft)
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          draft: true
          generate_release_notes: true
          body: |
            Build wytworzony przez CI na runnerze GitHuba (Windows Server 2022)
            z Pythonem 3.8.10, PyQt5 5.15.11 i PyInstaller 5.13.2.

            Artefakty:
            * `Core2Chat-windows-x64-onedir.zip` - katalog z EXE (zalecany dla
              Windows 7: szybszy start, pewniejsze ładowanie wtyczek Qt),
            * `Core2Chat-windows-x64-onefile.zip` - pojedynczy plik EXE
              (wolniejszy cold start - samorozpakowanie).

            **Wymaga weryfikacji na Windows 7 SP1 przed publikacją** - runner CI
            nie jest systemem docelowym. Lista kroków: `.github/RELEASE.md`.
