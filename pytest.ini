[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    live: requires CORE2CHAT_LIVE_TEST=1 and a real credential
    gui: requires a Qt platform (offscreen is fine)
    slow: longer running benchmarks
filterwarnings =
    ignore::DeprecationWarning
